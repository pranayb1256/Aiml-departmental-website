openapi: 3.0.0
info:
  title: AI & ML Department API
  description: API documentation for the AI & ML Department Website
  version: 1.0.0
servers:
  - url: http://localhost:8003/api
    description: Local server
  - url: https://your-backend.onrender.com/api
    description: Production server
paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the API
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    example: "2026-08-04T12:00:00Z"
  /alumini/:
    get:
      summary: Get all alumni
      description: Retrieve a list of all alumni
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                    name:
                      type: string
                    jobTitle:
                      type: string
                    photo:
                      type: string
  /faculty:
    get:
      summary: Get all faculty members
      description: Retrieve a list of all teaching faculty
      responses:
        '200':
          description: Successful response
  /admin/login:
    post:
      summary: Admin login
      description: Authenticate an admin user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
  /admin/notices:
    get:
      summary: Get all notices
      description: Retrieve a list of all official notices
      responses:
        '200':
          description: Successful response
    post:
      summary: Add a new notice
      description: Create a new notice (Requires Auth)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Notice created successfully
  /admin/announcements:
    get:
      summary: Get all announcements
      description: Retrieve a list of all announcements
      responses:
        '200':
          description: Successful response
    post:
      summary: Add a new announcement
      description: Create a new announcement (Requires Auth)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Announcement created successfully
  /events:
    get:
      summary: Get all events
      description: Retrieve a list of all upcoming and past events
      responses:
        '200':
          description: Successful response
    post:
      summary: Create a new event
      description: Add an event with image upload (Requires Auth)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Event created successfully
  /resources:
    get:
      summary: Get all resources
      description: Retrieve a list of syllabus, PYQs, and lab manuals
      responses:
        '200':
          description: Successful response
  /showcase:
    get:
      summary: Get innovation showcase
      description: Retrieve student projects and faculty research papers
      responses:
        '200':
          description: Successful response
  /events/winners:
    get:
      summary: Get past event winners
      description: Retrieve list of past hackathon and symposium winners
      responses:
        '200':
          description: Successful response
  /certificate/verify/{id}:
    get:
      summary: Verify a certificate
      description: Check if a certificate ID is valid
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The certificate ID to verify
      responses:
        '200':
          description: Certificate is valid
        '404':
          description: Certificate not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
